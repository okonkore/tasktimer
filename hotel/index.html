<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SARA GRANDE 五反田 空室履歴</title>
    <link rel="stylesheet" href="/hotel/styles.css?v=20260729" />
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div>
          <p class="eyebrow">自動記録は停止中</p>
          <h1>SARA GRANDE 五反田</h1>
          <p class="subtitle">空室状況の履歴</p>
        </div>
        <nav>
          <a href="/">タイマーへ</a>
          <a href="https://www.hotenavi.com/sara-gra/empty" target="_blank"
            rel="noreferrer">公式ページ</a>
        </nav>
      </header>

      <section class="latest-card" aria-live="polite">
        <div>
          <p class="label">現在の空室</p>
          <p
            class="room-count"><strong id="availableCount">--</strong><span>室</span></p>
          <p id="availabilityNote" class="note">履歴を読み込んでいます</p>
        </div>
        <div class="latest-meta">
          <p><span>準備中</span><strong id="preparingCount">--</strong></p>
          <p><span>サイト更新</span><strong id="pageReportedAt">--</strong></p>
          <p><span>最終確認</span><strong id="checkedAt">--</strong></p>
        </div>
        <button id="checkNow" type="button">今すぐ確認</button>
      </section>

      <section class="panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">直近24時間</p>
            <h2>空室数の推移</h2>
          </div>
          <p class="legend"><i></i> 空室数</p>
        </div>
        <div class="chart-wrap">
          <svg id="historyChart" role="img"
            aria-label="空室数の履歴グラフ"></svg>
          <p id="chartEmpty" class="empty"
            hidden>グラフに表示できる履歴がまだありません</p>
        </div>
      </section>

      <section class="panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">最新200件</p>
            <h2>確認履歴</h2>
          </div>
          <button id="downloadCsv" class="quiet-button"
            type="button">CSV保存</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>確認時刻</th>
                <th>空室</th>
                <th>準備中</th>
                <th>サイト更新</th>
                <th>結果</th>
              </tr>
            </thead>
            <tbody id="historyBody"></tbody>
          </table>
          <p id="historyEmpty" class="empty" hidden>履歴がまだありません</p>
        </div>
      </section>
    </main>
    <script src="/hotel/client.js?v=20260729"></script>
  </body>
</html>
